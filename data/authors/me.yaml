experience:
  - role: 项目发起人 / 唯一发明人 | Project Founder / Sole Inventor
    org: 智能自主控制可回收探空系统（独立研究项目）| Intelligent Autonomous Recoverable Sounding System
    start: '2024-10-01'
    summary: |
      系统由通信链路、飞行器（含探空装置）、地面站及业务计算终端等多部分构成，通过标准 750g 高空气球搭载升空，飞行器在约 30000 米高空与气球分离后，以可变斜翼无动力滑翔实现远程精确回收。设计“变斜翼融合弹翼”气动布局，实现无操控面下的高效姿态调节；采用 Solidworks 参数化建模及 Xflow、Xflr5、ANSYS-Fluent/Star CCM 多尺度 CFD 仿真；自主设计车规级六层高频 PCB；基于 MAVlink 协议开发地面站及内嵌 ISA 大气模型的业务计算终端；采用 CNC 加工 PMI 泡沫、FDM 打印 HT-PLA-GF、MJF 打印 PA11 等极端环境制造工艺；基于 MBD 方法开发非线性全耦合飞控算法，应用自整定 PID 与总能量管理策略实现稳定自主返航；自研特高频 LoRa CSS 射频链路结合 12 单元八木天线，实现低功率超远程双向通信。
      
      The system integrates a communications link, a flight vehicle (including the sounding payload), a ground station, and an operational computing terminal. Launched via a standard 750g high-altitude balloon, the vehicle separates from the balloon at approximately 30,000m and executes precise long-range recovery through unpowered gliding with a variable-sweep wing. Key contributions include: a novel "morphing swept wing + missile fin" aerodynamic configuration enabling efficient attitude control without conventional control surfaces; parametric modeling in SolidWorks with multi-scale CFD validation (XFlow, XFLR5, ANSYS-Fluent, STAR-CCM+); an automotive-grade six-layer high-frequency PCB; a custom MAVLink-based ground station and web terminal embedding ISA atmospheric models; extreme-environment manufacturing using CNC-machined PMI foam, FDM-printed HT-PLA-GF, and MJF-printed PA11 nylon; a nonlinear fully-coupled flight control system developed via Model-Based Design (MBD), employing auto-tuning PID and Total Energy Control System (TECS) strategies for stable autonomous return glide; and a custom UHF LoRa CSS RF link with a 12-element Yagi antenna enabling low-power, long-range bidirectional communication.

  - role: 唯一试飞负责人 | Sole Flight Test Director
    org: 沱沱河国家高空气象观测站与三江源 | Tuotuo River National High-Altitude Meteorological Station & Sanjiangyuan
    start: '2026-07-19'
    end: '2026-07-22'
    summary: |
      在沱沱河（海拔 4534.5 米，高寒、低压、强湍流环境）开展系统实测，验证装置在恶劣环境下的性能与稳定性。已联系中国科学院空天信息创新研究院、中国科学院大气物理研究所、格尔木市气象局、西宁市国家高空气象观测站、沱沱河国家高空气象观测站等单位审批空域，分别完成无人机低空搭载测试与 30000 米高空气球测试，验证了系统大部分功能。本人作为唯一试飞负责人，全程遵守国家相关法律法规与标准。
      
      Conducted field tests of the system at the Tuotuo River station (4,534m altitude; extreme cold, low pressure, and strong turbulence) to validate performance and reliability under harsh environmental conditions. Secured airspace approvals from the Aerospace Information Research Institute (CAS), the Institute of Atmospheric Physics (CAS), the Golmud Meteorological Bureau, the Xining National High-Altitude Meteorological Station, and the Tuotuo River National High-Altitude Meteorological Station. Completed both a drone-assisted low-altitude payload test and a 30,000m high-altitude balloon test, validating the majority of system functions. Served as the sole flight test director throughout, in strict compliance with relevant national laws and standards.

